<aside class="owner-sidebar" aria-label="Owner workspace navigation">
  <a class="owner-brand" href="{% url 'owner_dashboard' %}"><span class="owner-brand__mark">M</span><span>mahamongkol<small>OWNER STUDIO</small></span></a>
  <p class="owner-sidebar__label">WORKSPACE</p>
  <nav class="owner-side-nav" aria-label="Workspace">{% include 'dashboard/partials/owner_menu.html' %}</nav>
  <div class="owner-sidebar__bottom">
    <form class="owner-ui-switch" method="post" action="{% url 'switch_ui' %}">{% csrf_token %}<input type="hidden" name="interface" value="customer"><button type="submit"><span aria-hidden="true">⇄</span> Switch to customer</button></form>
    <div class="owner-preview-profile"><span class="owner-preview-profile__avatar">{{ request.user.username|first|upper }}</span><span><strong>{{ request.user.username }}</strong><small>Store owner</small></span><span class="owner-preview-profile__dots" aria-hidden="true">···</span></div>
    <form class="owner-signout" method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit"><span aria-hidden="true">↪</span> Sign out</button></form>
  </div>
</aside>
